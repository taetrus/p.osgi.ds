name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Test pde2tycho (migration tool, outside the Tycho reactor)
        run: ./mvnw --batch-mode --no-transfer-progress -f tools/pde2tycho verify

  docs:
    # Documentation check: ASD-STE100 style (0 hard violations) and relative links.
    # Runs next to the build job. Run it locally with tools/doccheck/check-docs.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs (STE lint and links)
        run: tools/doccheck/check-docs.sh

  pde2tycho-windows:
    # pde2tycho generates Windows run scripts and reads Windows paths, so its tests
    # also run on Windows. The Tycho reactor build stays on Linux only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test pde2tycho on Windows
        run: .\mvnw.cmd --batch-mode --no-transfer-progress -f tools/pde2tycho verify
